name: Build and push latex docker image

on:
  push:
    paths:
      - '.github/docker/Dockerfile'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: checkout repository
        uses: actions/checkout@v4
      
      - name: set up docker buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: image=moby/buildkit:master

      - name: log in to the container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: convert repository name to lowercase
        id: string
        run: |
          echo "repository_lowercase=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: build and push Ddcker image
        uses: docker/build-push-action@v5
        with:
          context: .github/docker
          push: true
          tags: ghcr.io/${{ steps.string.outputs.repository_lowercase }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max