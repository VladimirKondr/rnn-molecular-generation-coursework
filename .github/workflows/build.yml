name: Build LaTeX Document

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Install TeX Live and dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          texlive-xetex \
          texlive-latex-extra \
          texlive-fonts-extra \
          texlive-fonts-recommended \
          texlive-lang-cyrillic \
          texlive-bibtex-extra \
          biber \
          fonts-liberation \
          fonts-dejavu \
          fonts-dejavu-core \
          fonts-dejavu-extra \
          fontconfig
    
    - name: Install Microsoft Core Fonts
      run: |
        echo "ttf-mscorefonts-installer msttcorefonts/accepted-mscorefonts-eula select true" | sudo debconf-set-selections
        sudo apt-get install -y ttf-mscorefonts-installer
    
    - name: Install Times New Roman equivalent
      run: |
        sudo apt-get install -y \
          fonts-liberation2 \
          fonts-crosextra-carlito \
          fonts-crosextra-caladea
        
        # Обновляем кэш шрифтов
        sudo fc-cache -f -v
        
        # Проверяем доступные шрифты
        echo "Доступные шрифты Times:"
        fc-list | grep -i times || echo "Times New Roman не найден, будет использован Liberation Serif"
        echo "Доступные кириллические шрифты:"
        fc-list :lang=ru | head -10
    
    - name: Build PDF
      run: |
        chmod +x build.sh
        ./build.sh
    
    - name: Copy PDF to root
      run: |
        cp sources/main.pdf ./main.pdf
        echo "PDF файл создан: main.pdf"
        ls -lh main.pdf
    
    - name: Commit PDF to repository
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add main.pdf
        git diff --staged --quiet || git commit -m "Auto-build: Update main.pdf [skip ci]"
    
    - name: Push changes
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: ad-m/github-push-action@master
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        branch: ${{ github.ref }}
    
    - name: Upload PDF as artifact
      uses: actions/upload-artifact@v4
      with:
        name: main-pdf
        path: main.pdf
        retention-days: 30
    
    - name: Upload PDF to release (if tag)
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: main.pdf
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
