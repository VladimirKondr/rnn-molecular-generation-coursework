name: Build and Deploy LaTeX Document

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*.*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build_and_deploy:
    permissions:
      contents: write 

    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Install TeX Live and dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y texlive-full biber
        
        echo "Проверка biblatex-gost..."
        kpsewhich gost-numeric.bbx || echo "Warning: gost-numeric.bbx not found"
        
        biber --version
    
    - name: Install Microsoft Core Fonts
      run: |
        echo "ttf-mscorefonts-installer msttcorefonts/accepted-mscorefonts-eula select true" | sudo debconf-set-selections
        sudo apt-get install -y ttf-mscorefonts-installer
    
    - name: Install Times New Roman equivalent
      run: |
        sudo apt-get install -y fonts-liberation2 fonts-crosextra-carlito fonts-crosextra-caladea
        sudo fc-cache -f -v

    - name: Build PDF from LaTeX
      run: |
        ./build.sh
        ./build_presentation.sh
        
    - name: Commit and Push PDF
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        
        git add main.pdf
        git add presentation.pdf
        
        if ! git diff --staged --quiet; then
          git commit -m "Automated build: Update main.pdf and presentation.pdf [skip ci]"
          git push
        else
          echo "No changes to commit in main.pdf."
        fi
      
    - name: Create Release and Upload PDF
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: |
          main.pdf
          presentation.pdf
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload PDF as build artifact
      uses: actions/upload-artifact@v4
      with:
        name: generated-pdfs
        path: |
          main.pdf
          presentation.pdf
        retention-days: 7