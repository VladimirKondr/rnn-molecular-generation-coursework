name: Build and Deploy LaTeX Document

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*.*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build_and_deploy:
    permissions:
      contents: write 

    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Install TeX Live and dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y texlive-xetex texlive-latex-extra texlive-fonts-extra texlive-fonts-recommended texlive-lang-cyrillic texlive-bibtex-extra texlive-science texlive-publishers biber fonts-liberation fonts-dejavu fonts-dejavu-core fonts-dejavu-extra fontconfig
        
        # Проверяем наличие biblatex-gost
        echo "Проверка biblatex-gost..."
        kpsewhich gost-numeric.bbx || echo "Warning: gost-numeric.bbx not found"
        
        # Показываем версию biber
        biber --version
    
    - name: Install Microsoft Core Fonts
      run: |
        echo "ttf-mscorefonts-installer msttcorefonts/accepted-mscorefonts-eula select true" | sudo debconf-set-selections
        sudo apt-get install -y ttf-mscorefonts-installer
    
    - name: Install Times New Roman equivalent
      run: |
        sudo apt-get install -y fonts-liberation2 fonts-crosextra-carlito fonts-crosextra-caladea
        sudo fc-cache -f -v

    - name: Build PDF from LaTeX
      run: |
        ./build.sh
        
        
    
    - name: Commit and Push PDF
      if: github.event_name == 'push'
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        
        # Добавляем сгенерированный PDF в отслеживаемые файлы
        git add main.pdf
        
        # Проверяем, есть ли изменения. Если есть, делаем коммит.
        # `git diff --staged --quiet || ...` означает "если есть изменения, то выполнить..."
        if ! git diff --staged --quiet; then
          git commit -m "Automated build: Update main.pdf [skip ci]"
          # Используем стандартный git push, так как checkout@v4 настраивает токен
          git push
        else
          echo "No changes to commit in main.pdf."
        fi
      
    - name: Create Release and Upload PDF
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: main.pdf
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload PDF as build artifact
      uses: actions/upload-artifact@v4
      with:
        name: main-pdf
        path: main.pdf
        retention-days: 7