name: Build and Deploy LaTeX Document

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*.*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    outputs:
      image_name: ${{ steps.string.outputs.repository_lowercase }}

    steps:
      - name: checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: check for dockerfile changes
        uses: tj-actions/changed-files@v44
        id: changed-files
        with:
          files: .github/docker/Dockerfile
      
      - name: set up docker buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: image=moby/buildkit:master

      - name: log in to the container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: convert repository name to lowercase
        id: string
        run: |
          echo "repository_lowercase=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: build and push docker image
        uses: docker/build-push-action@v5
        with:
          context: .github/docker
          push: true
          tags: ghcr.io/${{ steps.string.outputs.repository_lowercase }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max



  build_pdf:
    needs: build-image

    permissions:
      contents: write
      packages: read

    runs-on: ubuntu-latest

    container:
      image: ${{ needs.build-image.outputs.image_name }}:latest
      credentials:
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Build PDF from LaTeX
      run: |
        ./build.sh
        ./build_presentation.sh
        
    - name: Commit and Push PDF
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        
        git add main.pdf
        git add presentation.pdf
        
        if ! git diff --staged --quiet; then
          git commit -m "Automated build: Update main.pdf and presentation.pdf [skip ci]"
          git push
        else
          echo "No changes to commit in main.pdf."
        fi
      
    - name: Create Release and Upload PDF
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: |
          main.pdf
          presentation.pdf
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload PDF as build artifact
      uses: actions/upload-artifact@v4
      with:
        name: generated-pdfs
        path: |
          main.pdf
          presentation.pdf
        retention-days: 7